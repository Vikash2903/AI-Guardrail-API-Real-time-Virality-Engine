spring.application.name=AI Guardrail API & Virality Engine

# Database Configuration (H2)
spring.datasource.url=jdbc:h2:file:./data/guardrail_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true

# Redis Configuration (Using Mock for Local Running)
spring.data.redis.repositories.enabled=false


# Logging
logging.level.com.guardrail=DEBUG

# Scheduled Tasks
spring.task.scheduling.pool.size=5
spring.main.allow-bean-definition-overriding=true

