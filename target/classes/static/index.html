<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Guardrail &amp; Virality Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            overflow-x: hidden;
        }
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .gradient-text {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .card-hover:hover {
            transform: translateY(-4px);
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        @keyframes pulse-slow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .status-pulse {
            animation: pulse-slow 2s infinite;
        }
    </style>
</head>
<body class="min-h-screen p-8">
    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <header class="flex justify-between items-center mb-12">
            <div>
                <h1 class="text-4xl font-bold gradient-text">AI Guardrail &amp; Virality Engine</h1>
                <p class="text-slate-400 mt-2">Real-time Virality & Safety Monitoring</p>
            </div>
            <div class="flex items-center gap-4">
                <span id="status-dot" class="w-3 h-3 bg-green-500 rounded-full status-pulse"></span>
                <span class="text-sm font-medium text-slate-300">System Live</span>
                <button onclick="refreshData()" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-lg text-sm font-bold transition-all">
                    Refresh
                </button>
            </div>
        </header>

        <!-- Stats Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
            <div class="glass p-6 rounded-2xl card-hover">
                <div class="flex items-center gap-4 mb-4">
                    <div class="p-3 bg-indigo-500/20 rounded-xl">
                        <i data-lucide="trending-up" class="text-indigo-400"></i>
                    </div>
                    <h3 class="text-lg font-semibold">Active Posts</h3>
                </div>
                <p id="post-count" class="text-4xl font-bold">0</p>
            </div>
            <div class="glass p-6 rounded-2xl card-hover">
                <div class="flex items-center gap-4 mb-4">
                    <div class="p-3 bg-purple-500/20 rounded-xl">
                        <i data-lucide="bot" class="text-purple-400"></i>
                    </div>
                    <h3 class="text-lg font-semibold">Bot Interactions</h3>
                </div>
                <p id="bot-interaction-count" class="text-4xl font-bold">0</p>
            </div>
            <div class="glass p-6 rounded-2xl card-hover">
                <div class="flex items-center gap-4 mb-4">
                    <div class="p-3 bg-orange-500/20 rounded-xl">
                        <i data-lucide="bell" class="text-orange-400"></i>
                    </div>
                    <h3 class="text-lg font-semibold">Pending Notifs</h3>
                </div>
                <p id="pending-notif-count" class="text-4xl font-bold">0</p>
            </div>
        </div>

        <!-- Main Content -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- Virality Scores -->
            <div class="glass rounded-2xl p-6">
                <h2 class="text-xl font-bold mb-6 flex items-center gap-2">
                    <i data-lucide="zap" class="text-yellow-400"></i>
                    Virality Leaderboard
                </h2>
                <div id="virality-list" class="space-y-4">
                    <!-- Dynamic Content -->
                </div>
            </div>

            <!-- Interaction Logs -->
            <div class="glass rounded-2xl p-6">
                <h2 class="text-xl font-bold mb-6 flex items-center gap-2">
                    <i data-lucide="terminal" class="text-green-400"></i>
                    Guardrail Activity
                </h2>
                <div id="log-list" class="space-y-3 font-mono text-sm max-h-[400px] overflow-y-auto">
                    <!-- Dynamic Content -->
                </div>
            </div>
        </div>

        <!-- Testing Tools -->
        <div class="mt-12 glass rounded-3xl p-8">
            <h2 class="text-2xl font-bold mb-6">Quick Actions (Testing)</h2>
            <div class="flex flex-wrap gap-4">
                <button onclick="triggerSeed()" class="bg-slate-700 hover:bg-slate-600 px-6 py-3 rounded-xl transition-all">Seed Data</button>
                <button onclick="simulatePost()" class="bg-indigo-600/50 hover:bg-indigo-600 px-6 py-3 rounded-xl transition-all">Create Post</button>
                <button onclick="simulateBotSpam()" class="bg-red-600/50 hover:bg-red-600 px-6 py-3 rounded-xl transition-all">Test Bot Spam (Concurrency)</button>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        async function fetchStats() {
            try {
                const res = await fetch('/api/dashboard/stats');
                const data = await res.json();
                updateUI(data);
            } catch (err) {
                console.error("Failed to fetch stats", err);
            }
        }

        async function fetchPosts() {
            try {
                const res = await fetch('/api/posts');
                const posts = await res.json();
                return posts;
            } catch (err) {
                return [];
            }
        }

        function updateUI(data) {
            const viralityList = document.getElementById('virality-list');
            const botInterCount = document.getElementById('bot-interaction-count');
            const pendingNotifCount = document.getElementById('pending-notif-count');
            
            // Update Totals
            let totalBotReplies = 0;
            Object.values(data.botCounts).forEach(v => totalBotReplies += parseInt(v));
            botInterCount.innerText = totalBotReplies;

            let totalPending = 0;
            Object.values(data.pendingNotifications).forEach(v => totalPending += v);
            pendingNotifCount.innerText = totalPending;

            // Update Leaderboard
            viralityList.innerHTML = '';
            Object.entries(data.viralityScores).forEach(([key, score]) => {
                const postId = key.split(':')[1];
                const botCount = data.botCounts[`post:${postId}:bot_count`] || 0;
                
                const div = document.createElement('div');
                div.className = 'glass p-4 rounded-xl flex justify-between items-center';
                div.innerHTML = `
                    <div>
                        <span class="text-sm text-slate-400">Post #${postId}</span>
                        <div class="font-bold">Virality: ${score}</div>
                    </div>
                    <div class="text-right">
                        <div class="text-xs text-slate-500 uppercase tracking-wider">Bot Replies</div>
                        <div class="text-lg font-bold ${botCount >= 100 ? 'text-red-400' : 'text-green-400'}">${botCount}/100</div>
                    </div>
                `;
                viralityList.appendChild(div);
            });
        }

        async function triggerSeed() {
            await fetch('/api/seed', { method: 'POST' });
            addLog("System seeded with initial User and Bot");
            refreshData();
        }

        async function simulatePost() {
            const res = await fetch('/api/posts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ authorId: 1, authorType: 'USER', content: 'Test post from Dashboard' })
            });
            const data = await res.json();
            addLog(`New Post Created: ID ${data.id}`);
            refreshData();
        }

        async function simulateBotSpam() {
            addLog("Triggering Concurrency Test: 200 bots replying simultaneously...");
            const res = await fetch('/api/posts');
            const posts = await res.json();
            if (posts.length === 0) {
                addLog("Error: Create a post first!", "error");
                return;
            }
            const postId = posts[posts.length - 1].id;
            
            // Fire 200 requests
            const promises = [];
            for(let i=0; i<200; i++) {
                promises.push(fetch(`/api/posts/${postId}/comments`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ authorId: 1, authorType: 'BOT', content: 'Beep boop ' + i, parentDepth: 0 })
                }));
            }
            
            const results = await Promise.all(promises);
            const success = results.filter(r => r.status === 200).length;
            const blocked = results.filter(r => r.status === 429).length;
            
            addLog(`Spam Results: ${success} Accepted, ${blocked} Blocked (Guardrail working)`);
            refreshData();
        }

        function addLog(msg, type = 'info') {
            const logList = document.getElementById('log-list');
            const entry = document.createElement('div');
            entry.className = `p-2 rounded border-l-4 ${type === 'error' ? 'bg-red-500/10 border-red-500' : 'bg-slate-800 border-indigo-500'}`;
            entry.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logList.insertBefore(entry, logList.firstChild);
        }

        function refreshData() {
            fetchStats();
            fetchPosts().then(posts => {
                document.getElementById('post-count').innerText = posts.length;
            });
        }

        // Auto-refresh every 5 seconds
        setInterval(refreshData, 5000);
        refreshData();
    </script>
</body>
</html>
